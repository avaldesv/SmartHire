<mat-form-field appearance="outline" class="year-stepper-field" subscriptSizing="dynamic">
  <mat-label>{{ label }}{{ required ? ' *' : '' }}</mat-label>

  <button
    matPrefix
    mat-icon-button
    type="button"
    class="year-stepper__btn"
    aria-label="Año anterior"
    [disabled]="!canDecrement"
    (click)="decrement(); $event.stopPropagation()"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <input
    matInput
    class="year-stepper__input"
    type="number"
    inputmode="numeric"
    [attr.min]="minYear"
    [attr.max]="maxYear"
    [value]="value"
    [disabled]="disabled"
    [attr.aria-label]="label"
    (input)="onInput($any($event.target).value)"
    (blur)="markTouched()"
  />

  <button
    matSuffix
    mat-icon-button
    type="button"
    class="year-stepper__btn"
    aria-label="Año siguiente"
    [disabled]="!canIncrement"
    (click)="increment(); $event.stopPropagation()"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>
</mat-form-field>
