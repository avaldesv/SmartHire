<div class="sh-feedback-dialog" [ngClass]="typeClass">
  <div class="sh-feedback-dialog__header">
    <mat-icon class="sh-feedback-dialog__icon" aria-hidden="true">{{ icon }}</mat-icon>
    <h2 class="sh-feedback-dialog__title">{{ data.title }}</h2>
  </div>

  <mat-dialog-content class="sh-feedback-dialog__content">
    <p class="sh-feedback-dialog__message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="sh-feedback-dialog__actions">
    @if (data.type === 'confirm') {
      <button mat-button type="button" (click)="close(false)">{{ cancelLabel }}</button>
      <button
        mat-flat-button
        type="button"
        [color]="data.confirmWarn ? 'warn' : 'primary'"
        (click)="close(true)"
      >
        {{ confirmLabel }}
      </button>
    } @else {
      <button mat-flat-button type="button" color="primary" (click)="close(false)">
        {{ primaryLabel }}
      </button>
    }
  </mat-dialog-actions>
</div>
