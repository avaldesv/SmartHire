<p class="intro">{{ intro }}</p>

<div class="sh-card sh-table-wrap">
  <table mat-table [dataSource]="types">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>{{ columnCode }}</th>
      <td mat-cell *matCellDef="let row"><code>{{ row.value }}</code></td>
    </ng-container>
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef>{{ columnLabel }}</th>
      <td mat-cell *matCellDef="let row">{{ row.label }}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>{{ columnDescription }}</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
