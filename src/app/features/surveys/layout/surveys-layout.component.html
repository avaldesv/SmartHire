<div class="surveys-layout sh-page">
  <h2>{{ pageTitle }}</h2>
  <div class="layout-body">
    <aside class="sidebar">
      @for (item of navItems(); track item.path) {
        <a [routerLink]="['/surveys', item.path]" routerLinkActive="active">{{ item.label }}</a>
      }
    </aside>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
