<div class="surveys-layout sh-page">
  <header class="surveys-header">
    <h2>{{ pageTitle }}</h2>
  </header>

  <nav class="surveys-tabs">
    @for (item of navItems(); track item.path) {
      <a [routerLink]="['/surveys', item.path]" routerLinkActive="active">{{ item.label }}</a>
    }
  </nav>

  <div class="tab-content">
    <router-outlet />
  </div>
</div>
