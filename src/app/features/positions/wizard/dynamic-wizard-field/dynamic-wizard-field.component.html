@if (isCheckbox) {
  <mat-checkbox [formControl]="control" [disabled]="disabled">{{ label }}</mat-checkbox>
} @else if (isSelect) {
  <sh-filterable-select
    subscriptSizing="dynamic"
    [label]="label"
    [options]="options"
    [valueField]="selectValueField"
    [valueFallbackField]="selectValueFallbackField"
    emptyLabel="—"
    [loading]="loadingOptions"
    [loadingLabel]="loadingOptionsLabel"
    [formControl]="control"
    [disabled]="disabled"
    [required]="required"
  />
} @else if (isMultiselect) {
  <sh-filterable-select
    class="multiselect-field"
    subscriptSizing="dynamic"
    [label]="label"
    [options]="options"
    valueField="id"
    [loading]="loadingOptions"
    [loadingLabel]="loadingOptionsLabel"
    [formControl]="control"
    [disabled]="disabled || loadingOptions"
    [required]="required"
    multiple
  />
} @else if (isDate) {
  <sh-datepicker-field [label]="label" [formControl]="control" [required]="required" />
} @else if (isTime) {
  <sh-timepicker-field [label]="label" [formControl]="control" [required]="required" />
} @else if (isMoney) {
  <sh-money-stepper-field
    [formControl]="control"
    [label]="label"
    [disabled]="disabled"
    [required]="required"
    [blockNonNumeric]="isSalaryMoney"
  />
} @else if (isSimpleInput) {
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    [class.span-2]="isTextarea"
    [class.textarea-field]="isTextarea"
  >
    <mat-label>{{ label }}</mat-label>
    @if (isTextarea) {
      <textarea
        matInput
        rows="6"
        [formControl]="control"
        [disabled]="disabled"
        [required]="required"
      ></textarea>
    } @else {
      <input
        matInput
        [type]="isNumber ? 'number' : 'text'"
        [min]="numberMin"
        [step]="numberStep"
        [formControl]="control"
        [disabled]="disabled"
        [required]="required"
      />
    }
    @if (control.touched && control.invalid) {
      <mat-error>{{ requiredError }}</mat-error>
    }
  </mat-form-field>
}
