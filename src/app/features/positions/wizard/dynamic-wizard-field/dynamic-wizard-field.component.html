@if (isCheckbox) {
  <mat-checkbox [formControl]="control" [disabled]="disabled">{{ label }}</mat-checkbox>
} @else if (isSelect) {
  <mat-form-field appearance="outline">
    <mat-label>{{ label }}</mat-label>
    <mat-select [formControl]="control" [disabled]="disabled || loadingOptions">
      @if (loadingOptions) {
        <mat-option disabled>Cargando...</mat-option>
      } @else {
        <mat-option [value]="null">—</mat-option>
        @for (opt of options; track opt.id) {
          <mat-option [value]="opt.id">{{ opt.label }}</mat-option>
        }
      }
    </mat-select>
  </mat-form-field>
} @else if (isSimpleInput) {
  <mat-form-field appearance="outline" [class.span-2]="isTextarea">
    <mat-label>{{ label }}</mat-label>
    @if (isTextarea) {
      <textarea matInput rows="3" [formControl]="control" [disabled]="disabled"></textarea>
    } @else {
      <input
        matInput
        [type]="isNumber ? 'number' : isDate ? 'date' : isTime ? 'time' : 'text'"
        [formControl]="control"
        [disabled]="disabled"
      />
    }
  </mat-form-field>
}
