<div class="job-requirements-ai">
  <sh-job-description-ai-field
    [control]="mandatoryControl"
    [disabled]="mandatoryDisabled || busy"
    [fieldLabel]="mandatoryLabel"
    [sectionTitle]="null"
    [showAiActions]="false"
    [showCharCount]="true"
    [rows]="3"
  />
  <sh-job-description-ai-field
    [control]="optionalControl"
    [disabled]="optionalDisabled || busy"
    [fieldLabel]="optionalLabel"
    [sectionTitle]="null"
    [showAiActions]="false"
    [showCharCount]="true"
    [rows]="3"
  />
  <sh-job-description-ai-field
    [control]="desirableControl"
    [disabled]="desirableDisabled || busy"
    [fieldLabel]="desirableLabel"
    [sectionTitle]="null"
    [showAiActions]="false"
    [showCharCount]="true"
    [rows]="3"
  />

  <div class="actions-row">
    <button
      mat-stroked-button
      type="button"
      (click)="onGenerate()"
      [disabled]="toolbarDisabled"
    >
      @if (busyAction === 'generate') {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        <mat-icon>auto_awesome</mat-icon>
      }
      {{ generateLabel }}
    </button>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="language-select">
      <mat-label>{{ languageLabel }}</mat-label>
      <mat-select [(value)]="selectedLanguage" [disabled]="toolbarDisabled">
        <mat-option value="es">Español</mat-option>
        <mat-option value="en">English</mat-option>
      </mat-select>
    </mat-form-field>

    <button
      mat-stroked-button
      type="button"
      (click)="onTranslate()"
      [disabled]="toolbarDisabled"
    >
      @if (busyAction === 'translate') {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        <mat-icon>translate</mat-icon>
      }
      {{ translateLabel }}
    </button>
  </div>
</div>
