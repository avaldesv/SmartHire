<div class="job-requirements-ai">
  <sh-job-description-ai-field
    [control]="mandatoryControl"
    [disabled]="mandatoryDisabled || busy"
    [fieldLabel]="mandatoryLabel"
    [sectionTitle]="null"
    [showAiActions]="false"
    [showCharCount]="true"
    [rows]="3"
  />
  <sh-job-description-ai-field
    [control]="optionalControl"
    [disabled]="optionalDisabled || busy"
    [fieldLabel]="optionalLabel"
    [sectionTitle]="null"
    [showAiActions]="false"
    [showCharCount]="true"
    [rows]="3"
  />
  <sh-job-description-ai-field
    [control]="desirableControl"
    [disabled]="desirableDisabled || busy"
    [fieldLabel]="desirableLabel"
    [sectionTitle]="null"
    [showAiActions]="false"
    [showCharCount]="true"
    [rows]="3"
  />
</div>
