<section class="job-description-ai" [class.job-description-ai--fill]="fillHeight">
  @if (showSectionTitle) {
    <h4 class="grid-title">{{ sectionTitle }}</h4>
  }

  <div class="textarea-wrap">
    <mat-form-field appearance="outline" class="textarea-field" subscriptSizing="dynamic">
      <mat-label>{{ fieldLabel }}</mat-label>
      <textarea matInput [rows]="rows" [formControl]="control" [disabled]="disabled || busy"></textarea>
    </mat-form-field>
    @if (showCharCount) {
      <span class="char-count" aria-live="polite">{{ charactersLabel }}: {{ characterCount }}</span>
    }
  </div>

  @if (showAiActions) {
    <div class="actions-row">
      <button
        mat-stroked-button
        type="button"
        (click)="onGenerate()"
        [disabled]="disabled || busy || selectedLanguageId == null"
      >
        @if (busyAction === 'generate') {
          <mat-spinner diameter="18"></mat-spinner>
        } @else {
          <mat-icon>auto_awesome</mat-icon>
        }
        {{ generateLabel }}
      </button>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="language-select">
        <mat-label>{{ languageLabel }}</mat-label>
        <mat-select
          [(value)]="selectedLanguageId"
          [disabled]="disabled || busy || !portalLanguages.length"
        >
          @for (language of portalLanguages; track language.id) {
            <mat-option [value]="language.id">{{ language.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button
        mat-stroked-button
        type="button"
        (click)="onTranslate()"
        [disabled]="disabled || busy || selectedLanguageId == null"
      >
        @if (busyAction === 'translate') {
          <mat-spinner diameter="18"></mat-spinner>
        } @else {
          <mat-icon>translate</mat-icon>
        }
        {{ translateLabel }}
      </button>
    </div>
  }
</section>
