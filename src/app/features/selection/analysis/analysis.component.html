@if (loading) {
  <div class="loading-wrap"><mat-spinner diameter="36" /></div>
} @else if (loadError) {
  <mat-card class="placeholder-card">
    <mat-card-content>
      <p>{{ labels.loadError }} #{{ positionId }}.</p>
    </mat-card-content>
  </mat-card>
} @else {
  <div class="sh-grid-3">
    <sh-kpi-card [label]="labels.kpiApplications" [value]="stats.total" icon="groups" iconBg="#2563eb" />
    <sh-kpi-card [label]="labels.kpiAvgCompatibility" [value]="stats.avgCompatibility + '%'" icon="percent" iconBg="#0d9488" />
    <sh-kpi-card [label]="labels.kpiPreselected" [value]="stats.selected" icon="check_circle" iconBg="#8b5cf6" />
    <sh-kpi-card [label]="labels.kpiWithInterview" [value]="stats.interviewed" icon="event" iconBg="#f97316" />
    <sh-kpi-card [label]="labels.kpiHired" [value]="stats.hired" icon="badge" iconBg="#16a34a" />
  </div>

  <mat-card class="placeholder-card">
    <mat-card-header><mat-card-title>{{ labels.detailTitle }}</mat-card-title></mat-card-header>
    <mat-card-content>
      <p>{{ labels.detailBody }} #{{ positionId }}.</p>
      <p class="hint">{{ labels.detailHint }}</p>
    </mat-card-content>
  </mat-card>
}
