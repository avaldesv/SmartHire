<div class="sh-catalog-dialog-header" mat-dialog-title>
  <span class="sh-catalog-dialog-header__text">{{ title }}</span>
</div>

<mat-dialog-content class="sh-catalog-dialog-body">
  <div class="sh-catalog-dialog-gap" aria-hidden="true"></div>
  @if (data.candidateName) {
    <p class="candidate-name">{{ data.candidateName }}</p>
  }

  @if (loading) {
    <div class="loading">
      <mat-spinner diameter="36" />
    </div>
  } @else if (loadError) {
    <p class="error-msg">{{ listErrorLabel }}</p>
  } @else if (templates.length === 0) {
    <p class="empty-msg">{{ emptyLabel }}</p>
  } @else {
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ selectLabel }}</mat-label>
        <mat-select formControlName="templateId">
          @for (tpl of templates; track tpl.id) {
            <mat-option [value]="tpl.id">{{ tpl.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="generating">{{ cancelLabel }}</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="confirm()"
    [disabled]="loading || loadError || templates.length === 0 || form.invalid || generating"
  >
    {{ generating ? generatingLabel : confirmLabel }}
  </button>
</mat-dialog-actions>
