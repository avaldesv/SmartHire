<sh-modal-form [title]="title">
  <form [formGroup]="form" class="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>{{ fieldEmail }}</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    @if (!isEdit) {
      <mat-checkbox formControlName="sendRegisterEmail">{{ fieldSendMail }}</mat-checkbox>
    } @else {
      <mat-checkbox formControlName="mustChangePassword">{{ fieldMustChange }}</mat-checkbox>
      <sh-filterable-select
        class="full"
        [label]="fieldRegisterStatus"
        [options]="statusOptions"
        formControlName="registerStatusId"
      />
    }
  </form>

  <div shModalActions>
    <button mat-stroked-button type="button" [mat-dialog-close]="false" [disabled]="saving">{{ cancelLabel }}</button>
    <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="saving">
      {{ saving ? savingLabel : saveLabel }}
    </button>
  </div>
</sh-modal-form>
