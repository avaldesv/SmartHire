<sh-modal-form [title]="title">
  <p class="hint">{{ hint }}</p>
  <p class="email"><code>{{ expectedEmail }}</code></p>
  <form [formGroup]="form" class="form" (ngSubmit)="confirm()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>{{ emailLabel }}</mat-label>
      <input matInput type="email" formControlName="confirmEmail" autocomplete="off" />
    </mat-form-field>
  </form>

  <div shModalActions>
    <button mat-stroked-button type="button" [mat-dialog-close]="false" [disabled]="deleting">{{ cancelLabel }}</button>
    <button mat-flat-button color="warn" type="button" (click)="confirm()" [disabled]="deleting || !matches">
      {{ confirmLabel }}
    </button>
  </div>
</sh-modal-form>
