<div class="reports-layout sh-page">
  <h2>{{ pageTitle }}</h2>
  <div class="layout-body">
    <aside class="sidebar">
      @for (cat of categoryOrder; track cat) {
        @if (categoryHasItems(cat)) {
          <h4>{{ categoryLabels[cat] }}</h4>
          @for (item of navItems; track item.slug) {
            @if (item.category === cat) {
              <a [routerLink]="['/reports', item.slug]" routerLinkActive="active">{{ item.label }}</a>
            }
          }
        }
      }
    </aside>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
