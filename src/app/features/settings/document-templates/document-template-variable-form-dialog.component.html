<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="variable-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ fieldCode }}</mat-label>
      <input matInput formControlName="code" autocomplete="off" />
      <mat-hint>{{ codeHint }}</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ fieldLabel }}</mat-label>
      <input matInput formControlName="label" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ fieldDescription }}</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>

    <mat-checkbox formControlName="isActive">{{ fieldActive }}</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">{{ cancelLabel }}</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="saving">
    {{ saving ? savingLabel : saveLabel }}
  </button>
</mat-dialog-actions>
