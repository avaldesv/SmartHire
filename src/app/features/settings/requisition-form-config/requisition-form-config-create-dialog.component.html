<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <div class="scope-banner" role="status">
    <p class="scope-hint">{{ scopeHint }}</p>
    <p class="scope-value">
      <strong>{{ scopeLabel }}:</strong>
      {{ fieldCountry }}: {{ data.countryName }}
      <span class="scope-sep" aria-hidden="true">·</span>
      {{ fieldCoverage }}: {{ data.coverageTypeName }}
    </p>
  </div>

  <form [formGroup]="form" class="create-form" (ngSubmit)="confirm()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ fieldName }}</mat-label>
      <input matInput formControlName="name" maxlength="150" autocomplete="off" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <mat-error>{{ nameRequired }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ cancelLabel }}</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()" [disabled]="form.invalid">
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
